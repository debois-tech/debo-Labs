name: Bug report
description: Something in a lab, the terminal, or the local app is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: input
    id: where
    attributes:
      label: Which lab or page?
      placeholder: linux-fundamentals / navigating, step 3
  - type: dropdown
    id: os
    attributes:
      label: Your system
      options: [macOS, Windows (Git Bash), Windows (WSL), Linux, Hosted version]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Output of `./start_local_labs.sh` or the browser console, if relevant
      render: shell
