# The lab server for split hosting: runs the real shells, with HTTPS in front. Works on any Linux server with Docker.
#   cp .env.example .env     (fill it in)
#   docker compose up -d --build
# The pages (for example on Vercel) call this server; see README.md in this folder.
services:
  labs:
    build: ../..
    image: debo-labs:server
    environment:
      # hosted profile (the default): invite codes, per-IP limits, tight timeouts
      # accounts: people sign up on this site and their progress is saved in the labs_data volume
      LAB_AUTH: "on"
      AUTH_SECRET: ${AUTH_SECRET:-}      # optional; generated into the volume when empty
      LAB_ACCESS_TOKENS: ${LAB_ACCESS_TOKENS:-}
      LAB_ALLOWED_ORIGINS: ${LAB_ALLOWED_ORIGINS:-}
      LAB_HARD_CAP_MIN: ${LAB_HARD_CAP_MIN:-0}      # 0 = no overall session time limit
      LAB_IDLE_MIN: ${LAB_IDLE_MIN:-30}             # a session with no typing for this long is closed to free its seat
      MAX_SESSIONS: ${MAX_SESSIONS:-50}              # learners at once (the image has 60 learner users)
      MAX_SESSIONS_PER_IP: ${MAX_SESSIONS_PER_IP:-50}  # a campus or class often sits behind one address
    expose: ["8080"]
    cpus: ${LAB_CPUS:-2.0}
    mem_limit: ${LAB_MEMORY:-5g}                  # leave the VM itself (and Caddy) room: size the VM at least 2 GB above this
    pids_limit: 4096
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=1g,mode=0755,exec
    volumes:
      - labs_data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      LABS_DOMAIN: ${LABS_DOMAIN:?set the lab server's domain, e.g. labs-api.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [labs]
    restart: unless-stopped

volumes:
  caddy_data:
  labs_data:
