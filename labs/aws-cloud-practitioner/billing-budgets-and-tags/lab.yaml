title: 'Billing: tags, budgets and support'
level: beginner
minutes: 12
summary: Tag resources for cost allocation, read a cost report, set a budget, and meet the support plans.
resources:
- title: AWS pricing
  url: https://aws.amazon.com/pricing/
  desc: How AWS pricing works and where to compare plans.
- title: Managing your costs with AWS Budgets
  url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
  desc: Budgets, alerts and actions.
- title: AWS Pricing Calculator
  url: https://calculator.aws/
  desc: Estimate a workload before you build it.
steps:
- id: pricing-models
  type: lesson
  title: How AWS bills you
  body: |
    **Pay as you go** by default (*On-Demand*). Lower the price by committing: **Savings Plans** and **Reserved Instances** (1 or 3 years), or use spare capacity with **Spot** (can be interrupted). The **Free Tier** covers small usage. Estimate with the **AWS Pricing Calculator**.

    **Tags** label resources (`Env=prod`) so costs can be grouped. **Budgets** alert you before spending runs away. Two servers are running in this account.

    *Cost Explorer numbers in this lab are simulated.*
- id: tag
  type: task
  title: Tag the untagged server
  body: |
    The instance named `batch-1` has no `Env` tag. Add the tag **`Env=prod`** to it.
  hint: aws ec2 create-tags --resources <id> --tags Key=...,Value=...
- id: cost-report
  type: task
  title: Cost by environment
  body: |
    Ask Cost Explorer (`aws ce get-cost-and-usage`) for **October 2026** (`Start=2026-10-01,End=2026-11-01`), **monthly**, metric **UnblendedCost**, **grouped by the tag `Env`**. Save the JSON in `cost.json`.

    (In real AWS you must first *activate* a tag as a cost allocation tag in the Billing console.)
  hint: --group-by Type=TAG,Key=Env  and  --time-period Start=...,End=...
- id: budget
  type: task
  title: Set a monthly budget
  body: |
    `budget.json` describes a monthly cost budget called `monthly-limit`, but its amount is 0. Make it **100 USD** and create it: `aws budgets create-budget --account-id 123456789012 --budget file://budget.json`.
  hint: Edit the Amount in the file first; the CLI refuses a budget of zero.
- id: trusted-advisor
  type: task
  title: Meet the support plans
  body: |
    **Trusted Advisor** checks your account for cost, security and reliability issues. Call it from the CLI: `aws support describe-trusted-advisor-checks --language en`.

    This account is on the free **Basic** support plan. Save the **error code** AWS returns in `support-error.txt`.
  hint: The error message starts with An error occurred (<Code>). Capture stderr with 2>&1 and pick the code with grep -o.
- id: support-note
  type: lesson
  title: What the error means
  body: |
    The Support API and the full set of Trusted Advisor checks need a **paid support plan** (Business level or higher); Basic includes only a few core checks in the console. Plan names and prices change, so check the Support pricing page before choosing.

    You can now estimate, label, monitor and cap AWS spending.
