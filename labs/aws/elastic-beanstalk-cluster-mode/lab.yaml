title: Elastic Beanstalk Cluster Mode
level: intermediate
minutes: 15
summary: "Explore a Cluster Mode replica: limits, ephemeral disk and autoscaling."
links:
  - title: EB Cluster Mode Docs
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/beanstalk-cluster.html
resources:
  - title: "Cluster Mode: Deploy web apps on EKS"
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/beanstalk-cluster.html
    desc: The official deep-dive on how Cluster Mode places your app on an EKS Auto Mode cluster.
  - title: What Is AWS Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html
    desc: The core concepts guide - environments, application versions, and the platform model.
  - title: AWS News Blog
    url: https://aws.amazon.com/blogs/aws/
    desc: Search "Elastic Beanstalk" for the Cluster Mode launch post and follow-up deep dives.
  - title: EKS Auto Mode
